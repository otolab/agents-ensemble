name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm test:run

  changeset-check:
    if: >-
      github.event_name == 'pull_request'
      && !startsWith(github.head_ref, 'release/')
      && !startsWith(github.head_ref, 'chore/')
      && !startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changeset
        run: |
          if git log origin/${{ github.base_ref }}..HEAD --format=%s | grep -q '\[skip-changeset\]'; then
            echo "✅ [skip-changeset] found, skipping changeset check"
            exit 0
          fi

          CHANGESETS=$(git diff --name-only --diff-filter=A origin/${{ github.base_ref }}...HEAD -- '.changeset/*.md' | grep -v README.md || true)

          if [ -z "$CHANGESETS" ]; then
            echo "❌ No changeset found in this PR"
            echo ""
            echo "Please add a changeset by running: pnpm changeset"
            echo "Or add [skip-changeset] to a commit message to skip this check."
            exit 1
          fi

          echo "✅ Changeset found:"
          echo "$CHANGESETS"

  validate-release-version:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract version from package.json
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Validate version
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: $VERSION"
            echo "Version must follow semantic versioning (e.g., 1.2.3)"
            exit 1
          fi
          echo "✅ Version format is valid: $VERSION"

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "❌ Tag v$VERSION already exists"
            echo "Please use a different version number"
            exit 1
          fi
          echo "✅ Tag v$VERSION does not exist"

          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LATEST_VERSION=${LATEST_TAG#v}
          echo "Latest version: $LATEST_VERSION"

          COMPARISON=$(node -p "
            const semver = require('semver');
            semver.gt('$VERSION', '$LATEST_VERSION') ? 'true' : 'false'
          ")

          if [ "$COMPARISON" != "true" ]; then
            echo "❌ Version $VERSION is not greater than $LATEST_VERSION"
            echo "New version must be greater than the latest version"
            exit 1
          fi
          echo "✅ Version $VERSION is greater than $LATEST_VERSION"
