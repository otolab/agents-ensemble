name: Version Update

on:
  push:
    branches:
      - 'release/**'

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Classify release push
      id: changesets
      run: |
        node .github/scripts/release-version-state.mjs \
          "${{ github.event.before }}" \
          "${GITHUB_SHA}" \
          "${{ github.event.created }}"

    - name: Apply version updates
      if: steps.changesets.outputs.apply_version_updates == 'true'
      run: |
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"

        pnpm changeset version

        BRANCH_NAME="${GITHUB_REF#refs/heads/}"
        if [[ "$BRANCH_NAME" =~ ^release/v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
          VERSION="${BASH_REMATCH[1]}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Updated root package.json to version $VERSION"
        fi

        pnpm install --lockfile-only

        if [ -n "$(git status --porcelain)" ]; then
          git add -A
          git commit -m "chore: version update via changeset"
          git push
        fi

    - name: Update root version only (when skipping changeset)
      if: steps.changesets.outputs.update_root_version == 'true'
      run: |
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"

        BRANCH_NAME="${GITHUB_REF#refs/heads/}"
        if [[ "$BRANCH_NAME" =~ ^release/v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
          VERSION="${BASH_REMATCH[1]}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Updated root package.json to version $VERSION (changeset skipped)"

          if [ -n "$(git status --porcelain)" ]; then
            git add package.json
            git commit -m "chore: update root version to $VERSION [skip-changeset]"
            git push
          fi
        else
          echo "⚠️ Invalid branch name format: $BRANCH_NAME"
          exit 1
        fi

    - name: Create or find Release PR
      if: steps.changesets.outputs.create_release_pr == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION=$(node -p "require('./package.json').version")
        BRANCH_NAME="${GITHUB_REF#refs/heads/}"
        SKIP_CHANGESET="${{ steps.changesets.outputs.skip_changeset }}"
        node .github/scripts/ensure-release-pr.mjs "$BRANCH_NAME" "$VERSION" "$SKIP_CHANGESET"

    - name: No changesets found
      if: steps.changesets.outputs.missing_changesets == 'true'
      run: |
        echo "⚠️ .changesetディレクトリにchangesetファイルが見つかりません"
        echo "リリース前に 'pnpm changeset' で変更内容を記録してください"
        echo "または、コミットメッセージに [skip-changeset] を含めてchangesetをスキップしてください"
        exit 1
