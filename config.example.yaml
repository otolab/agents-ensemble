# ensemble 共通設定の例（config.example.yaml）
#
# 使い方:
#   cp config.example.yaml .ensemble/config.yaml
#   または cp config.example.yaml ~/.ensemble/config.yaml
#
# 実運用の config は gitignore 対象。token 等の秘密情報は書かないこと。
# 詳細: docs/config.md

config:
  # user ~/.ensemble/config.yaml のみ有効。false で project config を読まない
  loadProjectConfig: true

profile:
  # --profile 未指定時の team profile（名前またはパス）
  default: implementer-and-reviewer-v2

conductor:
  # conductor backend（profile で指定した場合は profile が優先。cursor | pi）
  # Pi がコード上の既定。Cursor SDK を使う場合は cursor を指定。
  backend: pi
  # conductor モデル id（ensemble issue --model / CONDUCTOR_MODEL_ID より優先度低）
  model: default
  # reasoning は任意。指定値は選択した backend / model が検証します。
  # ensemble issue --reasoning でその起動だけ上書きできます。
  # CONDUCTOR_REASONING は ensemble issue / operator-agent の両方に適用します。
  # reasoning: high
  # harness の詳細 telemetry（CLI --verbose / CONDUCTOR_VERBOSE より優先度低）
  verbose: false
  # Pi backend の resource root（任意。パスだけを上書きする）
  # 相対パスは repoRoot 基準、~ はユーザ home 基準
  pi:
    agentDir: ~/.ensemble/pi
    projectDir: .ensemble/pi
    # models.json の apiKey: "!..." で使うキャッシュ helper と旧
    # ~/.ensemble/pi/cached-auth.sh からの移行は docs/pi-conductor-setup.md を参照。
    # 上記の各 root に settings.json / auth.json / models.json、
    # extensions/ / skills/ / prompts/ / themes/ を配置します。
    # settings.json は headless conductor の対応キー（モデル選択・認証
    # fallback・resource path・compaction.*・branchSummary.*）だけが有効です。
    # compaction / branchSummary は user → project の deep merge で適用します。
    # sessionDir は無視され、transcript は harness の
    # <repoRoot>/.ensemble/pi/sessions/ が正本です。settings.json の
    # defaultThinkingLevel は無視され、thinking は conductor.reasoning で指定します。
    # packages / TUI 等の Pi coding-agent 設定は警告なしで無視します。
    # Pi 標準の <repoRoot>/.pi/settings.json は headless conductor / operator-agent では読みません。
    # reload は起動時スナップショットを再適用し、設定変更の反映は resume/create で行います。
    # reload または snapshot 復元に失敗した session は close/dispose され unusable になります。
    # cleanup も失敗した場合は元エラーと cleanup error を含む AggregateError になります。
    # その session は再利用せず、resume/create で再作成してください。

acp:
  # 全 worker に適用する built-in preset。profile の acp 指定は受け付けない
  defaultPreset: cursor
  # Pi worker: byo（既定、PATH 上の pi と ~/.pi を使用）| builtin（同梱 Pi CLI と ~/.ensemble/pi を使用）
  # pi:
  #   runtime: builtin
  # codex-acp 等 spawn 時の env（user → project deep merge）。LiteLLM 例は docs/config.md
  # env:
  #   MODEL_PROVIDER: litellm
  #   CODEX_CONFIG: '{"approval_policy":"on-request"}'
  # model ID は環境ごとに設定し、profile には tier（modelTag）だけを書く
  models:
    # 構造化 entry では preset ごとの経路で reasoning を指定できる。
    # Cursor で reasoning / cursorFast を明示すると runtime 適用を確認できないため fail fast。
    # custom preset には model catalog を注入できない。
    high: YOUR_HIGH_MODEL_ID
    standard: YOUR_DEFAULT_MODEL_ID
    lightweight: YOUR_LOW_MODEL_ID
    lite: YOUR_LITE_MODEL_ID
    # reasoning 対応 preset（例: codex）なら、default と同じ model に reasoning: low を指定する形にもできる。
    # lite:
    #   model: YOUR_DEFAULT_MODEL_ID
    #   reasoning: low
  tags:
    high: high
    default: standard
    low: lightweight
    lite: lite

session:
  # isolated: Issue 専用 worktree（既定） / in-repo: メイン worktree で直接作業
  worktree: isolated
  # true の場合、worker は初回 prompt_worker まで ACP attach/init を行わない
  # lazyWorkers: true
  maxTurns:
    tty: 0       # 0 = 無制限
    nonTty: 5
  postLoop:
    wait: true   # TTY 時、自律ループ停止後に /exit まで待つ（--no-wait で上書き）

github:
  auth:
    # GITHUB_TOKEN / GH_TOKEN が無いとき gh auth token を試すか（既定: true）
    allowGhAuthTokenFallback: true
  monitor:
    enabled: true
    debounceMs: 60000
    pollIntervalMs: 120000
    activePollIntervalMs: 60000
    stopPollWaitMs: 5000

tui:
  # TTY レイアウト（非 TTY では pane）。env ENSEMBLE_TUI_LAYOUT より優先度低
  layout: stream # stream | pane（既定: stream）
  # Issue リンクの OSC 8 強制 on/off / 自動。env FORCE_HYPERLINK より優先度低
  forceHyperlink: auto   # auto | on | off
