# デフォルト動作モード: worker-and-reviewer
# conductor は SDK 経由で暗黙起動、worker は profile 定義どおりセッション開始時に bootstrap する。
# 詳細は team.md（3者共通）。役割別の起動文書は agents.<kind>.prompt / promptFile。

agents:
  conductor:
    promptFile: conductor.prompt.yaml
  implementer:
    promptFile: implementer.prompt.yaml
  reviewer:
    promptFile: reviewer.prompt.yaml

workers:
  - name: implementer
    kind: implementer
  - name: reviewer
    kind: reviewer

materials:
  - id: team
    title: 標準動作モード（conductor / implementer / reviewer）
    file: team.md
