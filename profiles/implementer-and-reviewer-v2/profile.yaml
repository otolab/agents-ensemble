# harness 接続は core base-module、チーム運用は team-common.md。

meta:
  title: implementer-and-reviewer-v2
  summary: conductor / implementer / reviewer — 役割別 materials 分割版（#288 作業中）

agents:
  conductor: {}
  implementer: {}
  reviewer: {}

workers:
