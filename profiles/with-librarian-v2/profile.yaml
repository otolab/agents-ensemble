# with-librarian-v2: implementer + reviewer + librarian（司書ロール）
# 役割の立場・振る舞いは materials に集約。agents は kind 登録のみ（prompt なし）。
# librarian の workspace は文書リポジトリの絶対パスまたは profile からの相対パスを指定する。

meta:
  title: with-librarian-v2
  summary: conductor / implementer / reviewer / librarian — 司書ロール付き materials 分割版

agents:
  conductor: {}
  implementer: {}
  reviewer: {}
  librarian: {}

workers:
  - name: implementer
    kind: implementer
  - name: reviewer
    kind: reviewer
  - name: librarian
    kind: librarian
    # workspace: /path/to/documentation-repository

materials:
  - id: team-common
    title: 標準動作モード（共通）
    file: team-common.md
  - id: team-conductor
    title: 標準動作モード（conductor）
    file: team-conductor.md
    kinds: [conductor]
  - id: team-implementer
    title: 標準動作モード（implementer）
    file: team-implementer.md
    kinds: [implementer]
  - id: team-reviewer
    title: 標準動作モード（reviewer）
    file: team-reviewer.md
    kinds: [reviewer]
  - id: team-librarian
    title: 標準動作モード（librarian）
    file: team-librarian.md
    kinds: [librarian]
